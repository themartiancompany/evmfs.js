  /* global
       app_name:
         writable */
  _set(
    "app",
    "name",
    "evmfs.js.lock");
  /* global
       app_opts:
         writable */
  _set(
    "app",
    "opts",
    []);
  /* global
       retries_max:
         writable */
  _set(
    "retries",
    "max",
    "");
  /* global
       call_timeout:
         writable */
  _set(
    "call",
    "timeout",
    "");
  /* global
       wallet_seed_path:
         writable */
  _set(
    "wallet_seed",
    "path",
    "");
  /* global
       api_key_path:
         writable */
  _set(
    "api_key",
    "path",
    "");
  /* global
       target_network:
         writable */
  _set(
    "target",
    "network",
    "");
  /* global
       contract_address:
         writable */
  _set(
    "contract",
    "address",
    "");
  /* global
       contract_abi_path:
         writable */
  _set(
    "contract_abi",
    "path",
    "");
  /* global
       contract_bytecode_path:
         writable */
  _set(
    "contract_bytecode",
    "path",
    "");
  /* global
       contract_compiler_output_path:
         writable */
  _set(
    "contract_compiler_output",
    "path",
    "");
  // After the method re-use will
  // have been added to the dynamic
  // caller as well
  // _set(
  //   "method",
  //   "object",
  //   "");
  /* global
       publication_namespace:
         writable */
  _set(
    "publication",
    "namespace",
    "");
  /* global
       file_hash:
         writable */
  _set(
    "file",
    "hash",
    "");
  /* global
       index_start:
         writable */
  _set(
    "index",
    "start",
    "");
  /* global
       index_end:
         writable */
  _set(
    "index",
    "end",
    "");
  /* global
       checkpoint_file_path:
         writable */
  _set(
    "checkpoint_file",
    "path",
    "");
  const
    _global =
      _global_get();
  _global[
    "quiet"] =
    "";
}

function
  _msg_info_chunk_lock(
    _index,
    _progress,
    _total) {
  const
    _msg =
      `Locking chunk '${_index}' ` +
      `('${_progress}'of '${_total}').`;
  _msg_info(
    _msg);
}

function
  _msg_info_chunk_locked(
    _tx,
    _index,
    _progress,
    _total) {
  const
    _msg =
      `Locked chunk '${_index}' ` +
      `('${_progress}'of '${_total}') ` +
      `at transaction with nonce '${_tx.nonce}' ` +
      `and hash '${_tx.hash}'.`;
  _msg_info(
    _msg);
}

function
  _msg_info_chunk_locked_already(
    _index,
    _progress,
    _total) {
  const
    _msg =
      `Chunk '${_index}' already locked ` +
      `('${_progress}'of '${_total}').`;
  _msg_info(
    _msg);
}

function
  _input_data_check(
    _chunks_total) {
  let
    _msg;
  if ( _chunks_total < 1 ) {
    _msg =
      "Upper chunk lower than lower chunk.";
    _msg_error(
      _msg,
      1);
  }
  _msg =
    `Input data checked, ` +
    `locking '${_chunks_total}' ` +
    `chunks`;
  _msg_info(
    _msg);
}

async function
  _chunk_lock(
    _contract_run_args,
    _verbose) {
  if ( typeof(
         _verbose) === "undefined" ||
       _verbose == "" ) {
    _verbose =
      false;
  }
  let
    _tx;
  try {
    _tx = await
      _contract_run.apply(
        null,
        _contract_run_args);
  } catch(
      _error) {
    const
      _msg =
        "Error locking chunk.";
    _msg_error(
      _msg,
      0);
    // TODO:
    // check if locked already according
    // to received error message
    if ( _verbose ) {
      _echo2(
        _tx);
      _echo2(
        _error);
    }
    throw _error;
  }
  return _tx;
}

async function
  _chunk_locked(
    _locked_call_args) {
  try {
    const
      [ _value,
        _method_object
      ] =
        await _contract_call_static.apply(
          null,
          _locked_call_args);
    return [
      _value,
      _method_object
    ];
  } catch(
      _error) {
    const
      _msg =
        "Error running '_contract_static_call' " +
        "with arguments:";
    _echo2(
      _locked_call_args);
    _error_display(
      _error);
    _msg_error(
      _error,
      0);
    throw _error;
  }
}

async function
  _chunks_lock(
    _retries_max,
    _call_timeout,
    _wallet_seed_path,
    _api_key_path,
    _target_network,
    _contract_address,
    _contract_abi_path,
    _contract_bytecode_path,
    _contract_compiler_output_path,
    _publication_namespace,
    _file_hash,
    _index_start,
    _index_end,
    _checkpoint_file_path) {
  let
    _checkpoint_index,
    _lock_call_args,
    _locked,
    _locked_call_base_args,
    _locked_call_args,
    _locked_method_object,
    _method_args,
    _msg,
    _progress,
    _tx;
  if ( typeof(
         _retries_max) === "undefined" ||
       _retries_max == "" ) {
    _retries_max =
      3;
    _msg =
      "Setting default maximum " +
      `retries '${_retries_max}'.`;
    _msg_info(
      _msg);
  }
  if ( typeof(
         _call_timeout) === "undefined" ||
       _call_timeout == "" ) {
    _call_timeout =
      60000;
    _msg =
      "Setting default call timeout " +
      `'${_call_timeout}'.`;
    _msg_info(
      _msg);
  }
  _call_timeout =
    Number(
      _call_timeout);
  _index_start =
    Number(
      _index_start);
  _index_end =
    Number(
      _index_end);
  const
    _wallet_password =
      "";
  _locked_method_object =
    "";
  const
    _lock_call_base_args = [
      _retries_max,
      _call_timeout,
      _wallet_seed_path,
      _wallet_password,
      _api_key_path,
      "",       // <---------    Price selection mode:
                //               It can be 'auto',
                //               'fast', 'nextblock' or an
                //               integer directly.
      0,
      "wei",
      _target_network,
      _contract_address,
      _contract_abi_path,
      _contract_bytecode_path,
      _contract_compiler_output_path,
      "lockChunk"
    ];
  _locked_call_base_args = [
    _wallet_seed_path,
    _retries_max,
    _api_key_path,
    _target_network,
    _contract_abi_path,
    _contract_bytecode_path,
    _contract_compiler_output_path,
    _locked_method_object,
    _contract_address,
    "lock"
  ];
  const
    _method_base_args = [
      _publication_namespace,
      _file_hash
    ];
  const
    _chunks_total =
      _index_end - index_start + 1;
  _input_data_check(
    _chunks_total);
  _progress =
    1;
  for ( var _index = _index_start;
        _index <= _index_end;
        _index++ ) {
    _msg_info_chunk_lock(
      _index,
      _progress,
      _chunks_total);
    _method_args =
      _method_base_args.concat(
        [_index.toString()]);
    _lock_call_args =
      _lock_call_base_args.concat(
        [_method_args]);
    _locked_call_args =
      _locked_call_base_args.concat(
        [_method_args] );
    [ _locked,
      _locked_method_object ] =
      await _chunk_locked(
        _locked_call_args);
    _msg =
      "Re-using method object";
    _msg_info(
      _msg);
    _locked_call_base_args = [
      _wallet_seed_path,
      _retries_max,
      _api_key_path,
      _target_network,
      _contract_abi_path,
      _contract_bytecode_path,
      _contract_compiler_output_path,
      _locked_method_object,
      _contract_address,
      "lock"
    ];
    if ( _locked == true ) {
      _msg_info_chunk_locked_already(
        _index,
        _progress,
        _chunks_total);
    }
    else if ( _locked == false ) {
      _tx = await
        _chunk_lock(
          _lock_call_args);
      _msg_info_chunk_locked(
        _tx,
        _index,
        _progress,
        _chunks_total);
    }
    _checkpoint_index =
      _index.toString();
    _file_write(
      _checkpoint_file_path,
      _checkpoint_index);
    _progress =
      _progress + 1;
  }
  _checkpoint_index =
    _index_end.toString();
  _file_write(
    _checkpoint_file_path,
    _checkpoint_index);
  _msg =
    "All chunks correcly locked.";
  _msg_info(
    _msg);
}

function
  _config_show() {
  let
    _line;
  const
    _program =
      _basename(
        _argv[
          0]);
  const
    _text = [
      ` ${_program} configuration:`,
      `                File hash: ${file_hash}`,
      `    Publication namespace: ${publication_namespace}`,
      `   Credentials settings:`,
      `              Wallet seed: ${wallet_seed_path}`,
      `       Network settings:`,
      `           Target network: ${target_network}`,
      `                  API Key: ${api_key_path}`,
      `             Call timeout: ${call_timeout}`,
      `          Maximum retries: ${retries_max}`,
      `      Contract settings:`,
      `         Contract address: ${contract_address}`,
      `             Contract ABI: ${contract_abi_path}`,
      `        Contract bytecode: ${contract_bytecode_path}`,
      ` Contract compiler output: ${contract_compiler_output_path}`,
      `       Session settings:`,
      `              Index start: ${index_start}`,
      `                Index end: ${index_end}`,
      `          Checkpoint file: ${checkpoint_file_path}`,
    ];
  for ( _line of _text ) {
    _msg_info(
      _line);
  }
}

function
  _usage(
    _exit_code) {
  let
    _line;
  const
    _program =
      _basename(
        _argv[
          0];
  const
    _text = [
      "",
      "Locks chunks of an EVMFS file.",
      "",
      "Usage:",
      `  ${app_name}`,
      "    <quiet>",
      "    <retries-max>",
      "    <call-timeout>",
      "    <api-key-path>",
      "    <target-network>",
      "    <contract-address>",
      "    <contract-abi-path>",
      "    <contract-bytecode-path>",
      "    <contract-compiler-output-path>",
      "    <publication-namespace>",
      "    <file-hash>",
      "    <index-start>",
      "    <index-start>",
      "    <index-end>",
      "    <checkpoint-file-path>",
      "",
      "Args:",
      "  <quiet>                          Can be 'y' or 'n'",
      "                                   Default: y",
      "  <retries-max>                    Maximum number of retries before",
      "                                   failing.",
      `                                   Default: ${retries_max}`,
      "  <call-timeout>                   How many milliseconds to wait for",
      "                                   a return",
      "                                   before declaring the call failed.",
      `                                   Default: ${call_timeout}`,
      "  <api-key-path>                   Path of the API key for the",
      "                                   contract ABI provider service.",
      "  <target-network>                 Network on which the contract",
      "                                   resides.",
      "  <contract-address>               Address of the contract.",
      "  <contract-abi-path>              Contract ABI path.",
      "  <contract-bytecode-path>         Path for the contract bytecode.",
      "  <contract-compiler-output-path>  Path for the contract compiler",
      "                                   output path (the hardhat artifact).",
      "  <publication-namespace>          Namespace in which the file is being",
      "                                   published.",
      "  <file-hash>                      Hash of the file to publish.",
      "  <index-start>                    Chunk index from where to start.",
      "  <index-end>                      Final chunk index to lock.",
      "  <checkpoint-file-path>           Checkpoint file on which latest",
      "                                   current locked chunk index is saved",
      "                                   in case node was to crash.",
    ];
  for ( _line of _text ) {
    _echo(
      _line);
  }
  _exit(
    _exit_code);
}

function
  _cmdline_parse() {
  let
    _msg;
  const
    _global =
      _global_get();
  _global[
    "quiet"] = 
    "y";
  _argv.forEach(
    function (
      _value,
      _index) {
      if ( _index == 2 ) {
        _global[
          "quiet"] =
          _value;
      }
      if ( _index == 3 ) {
        _set(
          "retries",
          "max",
          _value);
      }
      if ( _index == 4 ) {
        _set(
          "call",
          "timeout",
          _value);
      }
      if ( _index == 5 ) {
        _set(
          "wallet_seed",
          "path",
          _value);
      }
      if ( _index == 6 ) {
        _set(
          "api_key",
          "path",
          _value);
      }
      if ( _index == 7 ) {
        _set(
          "target",
          "network",
          _value);
      }
      if ( _index == 8 ) {
        _set(
          "contract",
          "address",
          _value);
      }
      if ( _index == 9 ) {
        _set(
          "contract_abi",
          "path",
          _value);
      }
      if ( _index == 10 ) {
        _set(
          "contract_bytecode",
          "path",
          _value);
      }
      if ( _index == 11 ) {
        _set(
          "contract_compiler_output",
          "path",
          _value);
      }
      if ( _index == 12 ) {
        _set(
          "publication",
          "namespace",
          _value);
      }
      if ( _index == 13 ) {
        _set(
          "file",
          "hash",
          _value);
      }
      if ( _index == 14 ) {
        _set(
          "index",
          "start",
          _value);
      }
      if ( _index == 15 ) {
        _set(
          "index",
          "end",
          _value);
      }
      if ( _index == 16 ) {
        _set(
          "checkpoint_file",
          "path",
          _value);
      }
      if ( _value == "-h" ||
           _value == "--help" ) {
        _global[
          "quiet"] =
          "n";
        _usage(
          0);
      }
  });
  if ( file_hash == "" ) {
    _msg =
      "Input hash is a required parameter.";
    _msg_error(
      _msg,
      0);
    _global[
      "quiet"] =
      "n";
    _overrides_set();
    _usage(
      1);
  }
  if ( publication_namespace == "" ) {
    _msg =
      "Publication namespace is a required parameter.";
    _msg_error(
      _msg,
      0);
    _global[
      "quiet"] =
      "n";
    _overrides_set();
    _usage(
      1);
  }
}

function
  _overrides_set() {
  _override_set(
    "call",
    "timeout",
    300000);
  _override_set(
    "retries",
    "max",
    3);
}

if ( await _cmdline_check(
       "evmfs.js.lock") ) {
  let
    _msg;
  _global_variables();
  _cmdline_parse();
  _overrides_set();
  _config_show();
  _msg =
    "Running 'chunks_lock' from command-line.";
  _msg_info(
    _msg);
  app_opts = [
    retries_max,
    call_timeout,
    wallet_seed_path,
    api_key_path,
    target_network,
    contract_address,
    contract_abi_path,
    contract_bytecode_path,
    contract_compiler_output_path,
    publication_namespace,
    file_hash,
    index_start,
    index_end,
    checkpoint_file_path
  ];
  try {
    _chunks_lock.apply(
      null,
      app_opts);
  }
  catch(
    _error) {
    _msg =
      "Error running '_chunks_lock' with" +
        "arguments:";
    _msg_error(
      _msg,
      0);
    _echo2(
      app_opts);
    _echo2(
      _error);
    throw _msg;
  }
}

export {
  _chunk_lock,
  _chunk_locked,
  _chunks_lock,
  _input_data_check,
  _msg_info_chunk_lock,
  _msg_info_chunk_locked,
  _msg_info_chunk_locked_already
};

